# Generated by `orch ci setup` from this repository's files. Safe to edit:
# orch never overwrites it unless asked to (--force).
#
# Runs on every pull request, which is what orch's auto-PR loop waits on
# (config.yaml `vcs:`), and on pushes to the base branch.
name: orch-ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the run it replaces (orch
# force-pushes retries); runs on the base branch always finish.
concurrency:
  group: orch-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest
