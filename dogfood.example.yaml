# Configuración de ejemplo. Copia a dogfood.yaml (ignorado por git) y ajusta.
roles:
  persona: [ag/gemini-3.8-flash]
  juez: [ag/claude-sonnet-5-5-medium]
  dedupe: [ag/gemini-3.8-flash]
  redactor: [ag/claude-sonnet-5-5-medium]

precios_usd_por_millon:
  ag/gemini-3.8-flash: { entrada: 0.30, salida: 2.50 }
  ag/claude-sonnet-5-5-medium: { entrada: 3.00, salida: 15.00 }

concurrencia: 5
tope_usd: null
umbral_publicar: media
repo_issues: hectorcanaimero/predicts
memoria_libre_min_gb: 2

# Tolerancias del oráculo (decisión D4)
tolerancias:
  ciclo_relativo_max: 0.25    # |ciclo - ciclo_real| <= 25 %
  pares_ok_min: 0.80          # al menos 80 % de los pares con 6+ compras
  compras_min_par: 6
  mae_dias_delta: 1           # MAE recalculado a ±1 día del declarado

# Motor por rol: api (9router) | claude_code (CLI `claude -p` con el plan Max)
motores: { persona: api, juez: api, dedupe: api, redactor: api }

claude_code:
  modelos: { persona: sonnet, juez: sonnet }   # si falta un rol, usa roles.<rol>
  mcp_config: null
  timeout_s: 180

# Bucle de agente propio (motor: bucle)
agente:
  max_capturas_por_paso: 1    # 0 = nunca adjunta captura
  resolucion_max: 1024        # lado mayor de la captura enviada al modelo

driver:
  tipo: web                   # web | android | ios
  serial: null                # Android por USB, o
  host_puerto: null           # 127.0.0.1:<p> o <ip de Tailscale>:<p>; nunca otra red
  paquete: null               # com.ejemplo.app
  actividad: null
  apk: null
  nodo: null                  # ios: nombre en `nodos`
  udid: null                  # ios
  bundle_id: null             # ios

# Pantalla en vivo de Android para la vista y el panel
pantalla:
  android: screencap          # screencap | screenrecord (necesita ffmpeg)
  fps: 2

# Apps Flutter: SDK, Patrol y copias de trabajo (nunca dentro del repo de la app)
flutter:
  sdk: /mnt/storage/flutter/bin/flutter
  patrol: /mnt/storage/flutter/.pub-cache/bin/patrol
  pub_cache: /mnt/storage/flutter/.pub-cache
  proyecto: null              # raíz de la app Flutter (solo lectura)
  copia_trabajo: /mnt/storage/cache/dogfood/flutter
  umbral_cobertura: 0.6       # bajo esto, una pantalla Flutter es «ciega»
  timeout_s: 1800

# Filtro web: la app Flutter compilada a web, servida solo en loopback o Tailscale
flutter_web:
  build_dir: null             # build/web ya compilado; si no, se compila desde flutter.proyecto
  host: 127.0.0.1
  puerto: 7480
  api_permitidas: []          # orígenes que la app web puede llamar
  dart_defines: {}

# Nodos iOS (Mac) por SSH: host solo 127.0.0.1 o una IP de Tailscale
nodos: {}
#  mac:
#    host: 100.x.y.z
#    usuario: hector
#    puerto_ssh: 22
#    comando: dogfood nodo     # en el PATH del Mac
#    dir_trabajo: ~/dogfood-nodo
#    proyectos: {}             # nombre → ruta de la app en el Mac

# Vista en vivo y panel: solo 127.0.0.1 o una IP de Tailscale, nunca 0.0.0.0
vista: { host: 127.0.0.1, puerto: 7460 }
panel: { host: 127.0.0.1, puerto: 7470 }
