[project]
name = "dogfood"
version = "0.1.0"
description = "Usuarios agénticos que prueban apps de verdad: issues de QA y opinión de usuario"
readme = "README.md"
authors = [
    { name = "Héctor Alejandro", email = "rodriguez.hectoralejandro@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
dogfood = "dogfood:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
