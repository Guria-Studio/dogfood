[project]
name = "dogfood"
version = "0.1.0"
description = "Usuarios agénticos que prueban apps de verdad: issues de QA y opinión de usuario"
readme = "README.md"
authors = [
    { name = "Héctor Alejandro", email = "rodriguez.hectoralejandro@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "browser-use>=0.13,<0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pillow>=12",
    "playwright>=1.64.1",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
dogfood = "dogfood.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
markers = ["integracion: necesita docker, predicts y credenciales reales"]
addopts = "-m 'not integracion'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
