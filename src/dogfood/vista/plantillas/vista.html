{% extends "base.html" %}
{% block titulo %}En vivo{% endblock %}
{% block contenido %}
<style>
  #grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1rem; }
  .tarjeta { border: 1px solid #8884; border-radius: 8px; padding: .75rem; cursor: pointer; }
  .tarjeta header { display: flex; justify-content: space-between; gap: .5rem; font-size: .85rem; }
  .tarjeta .cuerpo { display: flex; gap: .5rem; margin-top: .5rem; }
  .tarjeta canvas { width: 60%; background: #000; border-radius: 4px; }
  .tarjeta .razonamiento { flex: 1; max-height: 260px; overflow: auto; font-size: .75rem; list-style: none; margin: 0; padding: 0; }
  .tarjeta .razonamiento li { margin-bottom: .4rem; }
  .tarjeta.ampliada { grid-column: 1 / -1; }
  .tarjeta.ampliada .razonamiento { max-height: 70vh; font-size: .9rem; }
  .oculta { display: none; }
  #estado-ws { font-size: .8rem; }
</style>
<p id="estado-ws">Conectando…</p>
<div id="grilla"></div>
<template id="tpl-tarjeta">
  <article class="tarjeta">
    <header><strong class="persona"></strong><span class="escenario"></span><span class="driver"></span></header>
    <div class="meta"><span class="paso"></span> · <span class="latencia"></span> · <span class="resultado"></span></div>
    <div class="cuerpo">
      <canvas width="640" height="400"></canvas>
      <ol class="razonamiento" aria-label="Razonamiento"></ol>
    </div>
  </article>
</template>
<script src="/vista-estatico/vista.js"></script>
{% endblock %}
