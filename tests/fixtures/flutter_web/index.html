<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Flutter web (falso)</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; }
  flutter-view { display: block; position: relative; width: 100%; height: 100%; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; background: #eef; }
  flt-semantics-placeholder { position: absolute; left: -1px; top: -1px; width: 1px; height: 1px; }
  flt-semantics-host flt-semantics { position: absolute; display: block; left: 40px; width: 300px; height: 40px; }
</style></head>
<body>
<flutter-view>
  <canvas></canvas>
  <flt-semantics-placeholder role="button" aria-label="Enable accessibility" tabindex="0"></flt-semantics-placeholder>
</flutter-view>
<script>
  document.querySelector('flt-semantics-placeholder').addEventListener('click', () => {
    if (document.querySelector('flt-semantics-host')) return;
    const host = document.createElement('flt-semantics-host');
    const nodo = (rol, etiqueta, top) => {
      const n = document.createElement('flt-semantics');
      n.setAttribute('role', rol);
      n.setAttribute('aria-label', etiqueta);
      n.style.top = top + 'px';
      host.appendChild(n);
    };
    nodo('textbox', 'Email', 40);
    nodo('textbox', 'Contraseña', 100);
    nodo('button', 'Entrar', 160);
    document.querySelector('flutter-view').appendChild(host);
  });
</script>
</body></html>
